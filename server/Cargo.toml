[package]
name = "supercharge-studio-server"
version = "1.0.20"
description = "Supercharge Studio Server: headless encrypted mobile gateway for supercharge agent serve"
license = "Apache-2.0"
edition = "2021"

[[bin]]
name = "supercharge-studio-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "io-std", "signal"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake", "connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
qrcode = { version = "0.14", default-features = false }
dirs = "6"
if-addrs = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
