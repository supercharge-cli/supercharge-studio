name: Release

# Builds every app and publishes them as one GitHub Release.
# Trigger: push a tag like v0.1.0, or run manually (Actions -> Release -> Run workflow).
#
# Optional Android signing. Without these secrets the APKs are published unsigned:
#   ANDROID_KEYSTORE_B64   base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASS  keystore password
#   ANDROID_KEY_ALIAS      key alias (default: supercharge-studio)
#   ANDROID_KEY_PASS       key password (defaults to the keystore password)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (created if missing)"
        required: true
        default: v1.0.12

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - name: Collect
        shell: bash
        run: |
          mkdir -p rel
          # Fixed, versionless names so releases/latest/download/<name> never changes.
          # The version stays inside the package metadata.
          find src-tauri/target -path '*release/bundle/*' -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) | while read -r f; do
            case "$f" in
              *.AppImage)   n=Supercharge-Studio-linux-x86_64.AppImage ;;
              *.deb)        n=supercharge-studio-linux-amd64.deb ;;
              *.rpm)        n=supercharge-studio-linux-x86_64.rpm ;;
              *.dmg)        n=Supercharge-Studio-macos-universal.dmg ;;
              *.msi)        n=Supercharge-Studio-windows-x64.msi ;;
              *-setup.exe)  n=Supercharge-Studio-windows-x64-setup.exe ;;
            esac
            [ -e "rel/$n" ] && { echo "duplicate bundle for $n: $f"; exit 1; }
            cp "$f" "rel/$n"
          done
          ls -l rel
      - uses: actions/upload-artifact@v4
        with: { name: "rel-desktop-${{ matrix.os }}", path: "rel/*", if-no-files-found: error }

  server:
    name: Server (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, asset: linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: windows-x64, ext: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - run: cargo build --release --locked --manifest-path server/Cargo.toml
      - name: Collect
        shell: bash
        run: |
          mkdir -p rel
          cp server/target/release/supercharge-studio-server${{ matrix.ext }} rel/supercharge-studio-server-${{ matrix.asset }}${{ matrix.ext }}
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-gnu ]; then cp server/dist/supercharge-studio-server.service rel/; fi
      - uses: actions/upload-artifact@v4
        with: { name: "rel-server-${{ matrix.target }}", path: "rel/*", if-no-files-found: error }

  android:
    name: Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: mobile/src-tauri }
      - run: npm ci
      - name: Build release APKs (per ABI + universal)
        working-directory: mobile
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64
          mkdir -p ../rel/unsigned
          for f in src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk; do
            abi=$(basename "$(dirname "$(dirname "$f")")")
            # Gradle flavors are arm64 / arm / x86_64; drop anything else.
            case "$abi" in arm64|arm|x86_64) cp "$f" "../rel/unsigned/supercharge-studio-android-$abi.apk" ;; esac
          done
          npx tauri android build --apk --target aarch64 armv7 x86_64
          f=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          cp "$f" ../rel/unsigned/supercharge-studio-android-universal.apk
          ls -l ../rel/unsigned
      - name: Sign (only when the signing secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          mkdir -p rel/out
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "No signing secrets: publishing unsigned APKs."
            for f in rel/unsigned/*.apk; do cp "$f" "rel/out/$(basename "${f%.apk}")-unsigned.apk"; done
            exit 0
          fi
          export KEY_PASS="${KEY_PASS:-$KS_PASS}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          for f in rel/unsigned/*.apk; do
            out="rel/out/$(basename "$f")"
            "$BT/zipalign" -f -p 4 "$f" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
              --ks-key-alias "${KEY_ALIAS:-supercharge-studio}" --key-pass env:KEY_PASS \
              --out "$out" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify "$out"
          done
          rm -f "$RUNNER_TEMP/release.jks"
          ls -l rel/out
      - uses: actions/upload-artifact@v4
        with: { name: rel-android, path: "rel/out/*.apk", if-no-files-found: error }

  ios:
    name: iOS simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-ios-sim,aarch64-apple-ios" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: mobile/src-tauri }
      - run: npm ci
      - run: brew install xcodegen || true
      - working-directory: mobile
        run: npx tauri ios init --ci
      - working-directory: mobile
        env:
          TAURI_APP_PATH: ${{ github.workspace }}/mobile/src-tauri
        run: npx tauri ios build --debug --target aarch64-sim --ci
      - name: Zip .app
        run: |
          mkdir -p rel
          app=$(find mobile/src-tauri/gen/apple/build -name '*.app' -type d | head -1)
          ditto -c -k --keepParent "$app" rel/supercharge-studio-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with: { name: rel-ios, path: "rel/*", if-no-files-found: error }

  aur:
    name: AUR PKGBUILD
    needs: desktop
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: rel-desktop-ubuntu-22.04, path: bundles }
      - name: Generate PKGBUILD + .SRCINFO for the release deb, and test-build it
        run: |
          deb=$(find bundles -name '*.deb' | head -1)
          ver="${TAG#v}"
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/supercharge-studio-linux-amd64.deb"
          useradd -m builder
          # Validate with the local file first, then emit the URL-based PKGBUILD.
          out=$(bash scripts/aur.sh "$ver" "$deb")
          chown -R builder "$out" && su builder -c "cd $out && makepkg -f --nodeps"
          rm -rf "$out" && out=$(bash scripts/aur.sh "$ver" "$deb" "$url")
          chown -R builder "$out" && su builder -c "cd $out && makepkg --printsrcinfo > .SRCINFO"
          mkdir -p rel && cp "$out/PKGBUILD" rel/PKGBUILD && cp "$out/.SRCINFO" rel/SRCINFO.txt
          cat rel/PKGBUILD
      - uses: actions/upload-artifact@v4
        with: { name: rel-aur, path: "rel/*", if-no-files-found: error }

  publish:
    name: Publish GitHub Release
    needs: [desktop, server, android, ios, aur]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: rel-*, path: dist, merge-multiple: true }
      - name: Flatten, normalize names, checksums
        run: |
          mkdir -p out
          find dist -type f | while read -r f; do n=$(basename "$f" | tr ' ' '-'); cp "$f" "out/$n"; done
          rm -rf dist && mv out dist
          cd dist && sha256sum * > SHA256SUMS && ls -l
          # Every asset name must be versionless so releases/latest/download/<name> is stable.
          if ls | grep -E '[0-9]+\.[0-9]+\.[0-9]+'; then echo "versioned asset name found"; exit 1; fi
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Supercharge Studio $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber

  winget:
    name: winget update
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Submit winget update
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Output "::notice::WINGET_TOKEN not set; skipping winget update"
            exit 0
          }
          gh api repos/microsoft/winget-pkgs/contents/manifests/s/Supercharge/SuperchargeStudio --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::notice::Supercharge.SuperchargeStudio is not in winget-pkgs yet; skipping winget update"
            exit 0
          }
          $ver = "$env:TAG".TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/Supercharge-Studio-windows-x64.msi"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update Supercharge.SuperchargeStudio --version $ver --urls $url --submit --token $env:WINGET_TOKEN
