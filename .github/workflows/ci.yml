name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:mobile
      - name: Bundle size budgets
        run: npx vite-node scripts/budgets.ts

  hidden-spawns:
    name: No console-window spawns
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Every Command::new must go through the hidden helper
        run: |
          if grep -rn --include='*.rs' 'Command::new(' src-tauri/src server/src mobile/src-tauri/src | grep -v 'hidden-ok' | grep -v 'contains('; then
            echo "Use hidden::std_cmd / hidden::cmd (CREATE_NO_WINDOW on Windows) instead of Command::new"; exit 1
          fi

  e2e:
    name: E2E (fake ACP agent + Chromium)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build the headless server (for e2e/server.spec.ts)
        run: cargo build --release --locked --manifest-path server/Cargo.toml
      - run: npm ci
      - name: Port conflict end to end (2420 taken, server moves, phone pairs and follows it)
        run: npx vitest run tests/portconflict.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/

  server:
    name: Server (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --locked --manifest-path server/Cargo.toml
      - run: cargo build --release --locked --manifest-path server/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: supercharge-studio-server-${{ matrix.target }}
          path: |
            server/target/release/supercharge-studio-server
            server/target/release/supercharge-studio-server.exe
          if-no-files-found: error

  desktop:
    name: Desktop bundle (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: "--bundles deb,rpm"
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build ${{ matrix.args }}
      # Launch the real built app and click through every screen (fails on crash/blank window).
      - name: App smoke (Linux, WebKitGTK via WebDriver; default and no-compositing modes)
        timeout-minutes: 45
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --locked
          npx vite-node scripts/fake-agent.ts -- --port 2421 --secret e2e &
          sleep 5
          export SUPERCHARGE_STUDIO_AGENT=127.0.0.1:2421 SUPERCHARGE_AGENT_SECRET=e2e SMOKE_EXPECT_OPEN=1
          # Something else holds the gateway port: the app must move to another one and still pair.
          python3 -c "import socket,time;s=socket.socket();s.bind(('0.0.0.0',2420));s.listen();time.sleep(3600)" &
          SMOKE_EXPECT_PORT_MOVED=1 SMOKE_GATEWAY=1 xvfb-run -a -s "-screen 0 1360x860x24" node scripts/app-smoke.mjs src-tauri/target/release/supercharge-studio smoke/linux
          WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a -s "-screen 0 1360x860x24" node scripts/app-smoke.mjs src-tauri/target/release/supercharge-studio smoke/linux-nocomp
      - name: App smoke (Windows, WebView2 via WebDriver)
        timeout-minutes: 12
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo install tauri-driver --locked
          ver=$(powershell -NoProfile -Command "(Get-Item 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe').VersionInfo.ProductVersion" | head -1 | tr -d '\r')
          echo "WebView2 $ver"
          curl -fsSL -o edgedriver.zip "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip" || curl -fsSL -o edgedriver.zip "https://msedgedriver.azureedge.net/$ver/edgedriver_win64.zip"
          mkdir -p edgedriver && unzip -o -q edgedriver.zip -d edgedriver
          export PATH="$PWD/edgedriver:$PATH"
          npx vite-node scripts/fake-agent.ts -- --port 2421 --secret e2e &
          sleep 5
          export SUPERCHARGE_STUDIO_AGENT=127.0.0.1:2421 SUPERCHARGE_AGENT_SECRET=e2e SMOKE_EXPECT_OPEN=1
          exe="$PWD/src-tauri/target/release/supercharge-studio.exe"
          # Hard check: the app starts and stays up (no crash) for 15s.
          "$exe" > smoke-win.log 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 $pid 2>/dev/null; then echo "app exited early"; cat smoke-win.log; exit 1; fi
          kill $pid || true
          echo "Windows app stayed up for 15s"
          # Click-through via WebDriver (best effort: msedgedriver/WebView2 pairing on hosted runners is flaky).
          node scripts/app-smoke.mjs "$exe" smoke/windows || echo "::warning::WebDriver click-through did not complete on Windows"
      - name: App smoke (macOS, launch + screenshot; WebDriver is not available for WKWebView)
        timeout-minutes: 12
        if: matrix.os == 'macos-latest'
        run: |
          app=$(find src-tauri/target -path '*release/bundle/macos/*.app' -maxdepth 6 | head -1)
          bin="$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)"
          "$bin" > smoke-mac.log 2>&1 &
          pid=$!
          sleep 15
          mkdir -p smoke/macos
          screencapture -x smoke/macos/app.png || true
          if ! kill -0 $pid 2>/dev/null; then echo "app exited early"; cat smoke-mac.log; exit 1; fi
          kill $pid
          echo "macOS app stayed up for 15s"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-smoke-${{ matrix.os }}
          path: smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: supercharge-studio-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: warn

  aur:
    name: AUR package (makepkg in Arch Linux)
    needs: desktop
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: supercharge-studio-ubuntu-22.04, path: bundles }
      - name: Build and inspect the package
        run: |
          pacman -Syu --noconfirm --needed namcap
          deb=$(find bundles -name '*.deb' | head -1)
          ver=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9.]+)".*/\1/')
          out=$(bash scripts/aur.sh "$ver" "$deb")
          useradd -m builder && chown -R builder "$out"
          cd "$out"
          su builder -c "makepkg --printsrcinfo > .SRCINFO" && cat .SRCINFO
          su builder -c "makepkg -f --nodeps"
          namcap PKGBUILD || true
          ls -l *.pkg.tar.*
          bsdtar -tf *.pkg.tar.* | grep -q usr/bin/supercharge-studio

  android:
    name: Android APKs (release, per ABI)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri
      - run: npm ci
      - name: Build release APKs (stripped, one per ABI, unsigned)
        working-directory: mobile
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64
          ls -l src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: supercharge-studio-android
          path: mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    name: iOS (unsigned simulator build)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri
      - run: npm ci
      - run: brew install xcodegen || true
      - name: Generate Xcode project
        working-directory: mobile
        run: npx tauri ios init --ci
      - name: Build for the simulator (no signing)
        working-directory: mobile
        # Xcode's build phase re-invokes the CLI from the repo root; point it at the mobile app.
        env:
          TAURI_APP_PATH: ${{ github.workspace }}/mobile/src-tauri
        run: npx tauri ios build --debug --target aarch64-sim --ci
      - uses: actions/upload-artifact@v4
        with:
          name: supercharge-studio-ios-simulator
          path: mobile/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
