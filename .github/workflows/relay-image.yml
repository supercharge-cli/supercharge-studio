name: Relay image

on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay-image.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test the relay
        run: |
          npm ci --no-audit --no-fund
          npx vitest run tests/relay.test.ts
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Smoke test the image
        run: |
          docker build -t relay-smoke relay
          docker run -d --name relay-smoke -p 8080:8080 relay-smoke
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/healthz | grep '"ok":true'
          docker rm -f relay-smoke
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/supercharge-studio-relay
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
