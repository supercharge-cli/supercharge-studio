<!doctype html><html><head><meta charset="utf-8"><title>Supercharge cursor</title><style>html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:12px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none}#c{position:fixed;left:0;top:0;transform:translate(-40px,-40px);transition:transform .38s cubic-bezier(.3,.7,.2,1);will-change:transform}#c svg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}.rm #c{transition:none}#l{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:#7c5cff;color:#fff;padding:4px 10px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.3);white-space:nowrap}#l i{width:6px;height:6px;border-radius:50%;background:#fff;animation:p 1.2s infinite}.rm #l i{animation:none}#b{position:absolute;left:20px;top:20px;background:rgba(17,17,20,.85);color:#fff;border-radius:6px;padding:1px 7px;white-space:nowrap;display:none}.r{position:fixed;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid #7c5cff;background:rgba(124,92,255,.18);animation:r .55s ease-out forwards;pointer-events:none}.rm .r{animation:none;opacity:.8;transform:scale(.8)}@keyframes r{from{transform:scale(.3);opacity:1}to{transform:scale(1.7);opacity:0}}@keyframes p{50%{opacity:.3}}</style></head><body></body></html>
