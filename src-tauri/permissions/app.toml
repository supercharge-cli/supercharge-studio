[[permission]]
identifier = "allow-app"
description = "Agent process, stdio transport and side-browser control for the main window."
commands.allow = [
  "app_config", "agent_probe", "agent_start", "agent_stop",
  "stdio_start", "stdio_send", "stdio_stop",
  "browser_open", "browser_navigate", "browser_set_bounds", "browser_eval", "browser_close", "browser_set_visible", "browser_screenshot", "browser_set_zoom", "browser_cursor", "secret_get", "secret_set", "mcp_result", "mcp_info", "provider_set_key", "provider_has_key", "provider_seed_from_env", "provider_discover_models", "provider_apply", "agent_restart", "agent_info", "agent_log", "agent_install", "cli_status", "cli_install", "agent_check", "agent_free_port", "agent_log_note",
  "gateway_status", "gateway_start", "gateway_stop", "gateway_pair_begin", "gateway_pair_answer", "gateway_revoke", "gateway_send", "gateway_relay_set",
  "fs_list", "fs_read_text",
    "background_get", "background_set", "upload_chunk", "upload_rewrite", "gateway_firewall_allow", "host_package",
  "term_open", "term_write", "term_resize", "term_close", "pick_folder",
  "update_download", "update_restart",
  "telemetry_get", "telemetry_set", "telemetry_js_error", "telemetry_event",
]
