[package]
name = "supercharge-studio-mobile"
version = "1.0.23"
description = "Supercharge Studio mobile companion"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "supercharge_studio_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Syntax highlighting (TextMate grammars, pure-Rust regex so every target builds without C deps).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
tauri = { version = "2", features = [] }
# generate_context!() expands to serde_json calls on every target (also host `cargo test`).
serde_json = "1"
# Crash reports / usage stats (shared telemetry module; plain HTTPS POSTs, no SDK).
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-deep-link = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "unwind"
strip = true
