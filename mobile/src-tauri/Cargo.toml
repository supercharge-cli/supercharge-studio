[package]
name = "supercharge-studio-mobile"
version = "0.1.7"
description = "Supercharge Studio mobile companion"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "supercharge_studio_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# generate_context!() expands to serde_json calls on every target (also host `cargo test`).
serde_json = "1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-deep-link = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "unwind"
strip = true
